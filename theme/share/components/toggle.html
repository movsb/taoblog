<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>iOS Toggle</title>
	<link rel="stylesheet" href="./style.css">
	<script src="./toggle.js" defer></script>
	<style>
		body {
			max-width: 420px;
			margin: 60px auto;
			padding: 0 20px;
			font: 16px/1.5 system-ui, sans-serif;
		}
		fieldset {
			display: grid;
			gap: 20px;
			padding: 24px;
		}
	</style>
</head>
<body>
	<form id="demo">
		<fieldset>
			<legend>开关</legend>
			<ios-toggle name="notifications" label="消息通知"></ios-toggle>
			<ios-toggle name="dark-mode" label="深色模式" checked></ios-toggle>
			<ios-toggle label="不可操作" disabled></ios-toggle>
			<ios-toggle label="主题色" style="--ios-toggle-on-color: var(--accent-color, #ac53ac)"></ios-toggle>
		</fieldset>
	</form>
</body>
</html>
