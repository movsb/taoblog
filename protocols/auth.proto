syntax = "proto3";
package protocols;
option go_package = "github.com/movsb/taoblog/proto";

// 本地客户端登录请求。
message ClientLoginRequest {}
message ClientLoginResponse {
	message Open {
		// 需要在浏览器上打开此链接来授权。
		string auth_url = 1;
	}
	message Success {
		string token = 1;
	}

	oneof Response {
		Open open = 1;
		Success success = 2;
	}
}

message User {
	int64 id = 1;
	int64 created_at = 2;
	int64 updated_at = 3;
	
	// 昵称
	string nickname = 4;
	
	// 密码。
	// 自动生成，输出参数。
	string password = 5;

	// 头像 DataURL。
	string avatar = 6;

	// 邮箱
	string email = 7;
	string bark_token = 8;

	// 已归档。
	bool hidden = 9;
}

message ListUsersRequest {
	bool with_hidden = 1;
	bool with_unnamed = 2;
}

message ListUsersResponse {
	repeated User users = 1;
}

message UpdateUserRequest {
	User user = 1;

	bool update_avatar = 10;
	bool update_email = 11;
	bool update_bark_token = 12;
	bool update_nickname = 13;
}

message UpdateUserResponse {}

message Settings {
	// 首页是否按分类展示文章？
	bool group_posts_by_category = 100;

	// 是否把过往文章按“遗忘曲线（模拟）”添加到日历作为提醒。
	bool review_posts_in_calendar = 101;

	// 日历链接。
	// 仅输出参数。
	string calendar_url = 200;
}

message SetUserSettingsRequest {
	Settings settings = 1;

	bool update_group_posts_by_category = 100;
	bool update_review_posts_in_calendar = 101;
}

message GetUserSettingsRequest {
	// 如果是系统管理员，此参数可以用来获取任意用户的参数。
	// 如果不是系统管理员，此参数无效。
	uint32 user_id = 1;
}
